name: Fetch Amazon Data

on:
  # Run on schedule (before main update job)
  schedule:
    - cron: '30 0 * * 1'  # Monday 00:30 UTC (after GLS at 00:00)
  workflow_dispatch:

jobs:
  fetch-amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch Amazon data
        id: fetch
        run: python scripts/amazon_fetch_all.py
        timeout-minutes: 90
        continue-on-error: true

      - name: Report anomaly
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::Amazon data anomaly detected — existing cache preserved, will retry next week"
          echo "## ⚠️ Amazon data anomaly" >> "$GITHUB_STEP_SUMMARY"
          echo "Location count dropped >20% or returned 0 results." >> "$GITHUB_STEP_SUMMARY"
          echo "Existing cache preserved. Will retry automatically next Monday." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit and push Amazon data
        if: steps.fetch.outcome == 'success'
        run: |
          git pull --rebase origin main || true
          git add data/amazon_all_locations.json 2>/dev/null || true
          git add scripts/amazon_update_log.txt 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Update Amazon data - $(date +'%Y-%m-%d %H:%M UTC')" && git push)
