name: Update Pakketpunten Data

on:
  schedule:
    # Run weekly on Monday at 02:00 UTC (after GLS/Amazon workflows complete)
    - cron: '0 2 * * 1'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch DHL grid data (nationwide cache)
        id: fetch_dhl
        run: python scripts/dhl_grid_fetch.py
        working-directory: ${{ github.workspace }}
        timeout-minutes: 30
        continue-on-error: true

      - name: Fetch DPD data (nationwide cache)
        id: fetch_dpd
        run: python scripts/dpd_fetch_all.py
        working-directory: ${{ github.workspace }}
        timeout-minutes: 15
        continue-on-error: true

      - name: Fetch ViaTim data (nationwide cache)
        id: fetch_viatim
        run: python scripts/viatim_fetch_all.py
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        continue-on-error: true

      - name: Fetch InPost data (nationwide cache)
        id: fetch_inpost
        run: python scripts/inpost_fetch_all.py
        working-directory: ${{ github.workspace }}
        timeout-minutes: 10
        continue-on-error: true

      - name: Fetch Budbee data (DPD cache + OSM)
        id: fetch_budbee
        run: python scripts/budbee_fetch_all.py
        working-directory: ${{ github.workspace }}
        timeout-minutes: 10
        continue-on-error: true

      # GLS data is fetched by separate workflow (fetch-gls-data.yml)
      # That workflow runs earlier and commits the cache file to the repo
      # This workflow uses the already-committed cache file

      - name: Check for data anomalies
        id: anomaly_check
        run: |
          anomalies=""
          if [ "${{ steps.fetch_dhl.outcome }}" = "failure" ]; then anomalies="${anomalies}DHL "; fi
          if [ "${{ steps.fetch_dpd.outcome }}" = "failure" ]; then anomalies="${anomalies}DPD "; fi
          if [ "${{ steps.fetch_viatim.outcome }}" = "failure" ]; then anomalies="${anomalies}ViaTim "; fi
          if [ "${{ steps.fetch_inpost.outcome }}" = "failure" ]; then anomalies="${anomalies}InPost "; fi
          if [ "${{ steps.fetch_budbee.outcome }}" = "failure" ]; then anomalies="${anomalies}Budbee "; fi

          if [ -n "$anomalies" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "carriers=${anomalies}" >> "$GITHUB_OUTPUT"
            echo "::warning::Data anomalies detected for: ${anomalies}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send alert email on anomalies
        if: steps.anomaly_check.outputs.found == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_EMAIL_USERNAME }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "⚠️ Pakketpunten: data anomaly for ${{ steps.anomaly_check.outputs.carriers }}"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: Pakketpunten Bot <${{ secrets.ALERT_EMAIL_USERNAME }}>
          body: |
            Data anomalies detected during the weekly update for: ${{ steps.anomaly_check.outputs.carriers }}

            For each affected carrier, the location count dropped by more than 20% or returned 0 results.
            Existing caches have been preserved to prevent data loss.
            The batch generation will proceed using the preserved caches.

            Please investigate the affected APIs and re-run the fetch scripts manually when resolved.

            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

      - name: Check GLS cache status
        run: |
          echo "=== Cache file status ==="
          ls -la data/gls_all_locations.json 2>/dev/null || echo "GLS cache not found"
          if [ -f data/gls_all_locations.json ]; then
            echo "GLS: $(python -c "import json; d=json.load(open('data/gls_all_locations.json')); print(len(d.get('locations', [])))" 2>/dev/null || echo '0') locations"
          fi

      - name: Generate pakketpunten data
        run: |
          python scripts/batch_generate.py
          python scripts/create_national_overview.py
        working-directory: ${{ github.workspace }}
        timeout-minutes: 60

      - name: Update totals history
        run: python scripts/update_totals_history.py
        working-directory: ${{ github.workspace }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit and push if changed
        run: |
          # Add cache files (DHL, DPD, ViaTim, InPost, Budbee - GLS committed by separate workflow)
          git add data/dhl_all_locations.json data/dpd_all_locations.json data/viatim_all_locations.json data/inpost_all_locations.json data/budbee_all_locations.json 2>/dev/null || true
          # Add municipality GeoJSON files (excluding gitignored nederland-boundaries.geojson)
          find webapp/public/data -name "*.geojson" -not -name "nederland-boundaries.geojson" -exec git add {} +
          git add webapp/public/data/summary.json webapp/public/data/totals_history.json webapp/public/municipalities.json 2>/dev/null || true
          # Commit first, then pull --rebase to integrate any pushes made during the run
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "🤖 Update pakketpunten data - $(date +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
