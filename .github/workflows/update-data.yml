name: Update Pakketpunten Data

on:
  schedule:
    # Run weekly on Monday at 02:00 UTC (after GLS/FedEx workflows complete)
    - cron: '0 2 * * 1'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch DHL grid data (nationwide cache)
        run: python scripts/dhl_grid_fetch.py
        working-directory: ${{ github.workspace }}
        timeout-minutes: 30

      - name: Fetch DPD data (nationwide cache)
        run: python scripts/dpd_fetch_all.py
        working-directory: ${{ github.workspace }}
        timeout-minutes: 15

      # GLS data is fetched by separate workflow (fetch-gls-data.yml)
      # That workflow runs earlier and commits the cache file to the repo
      # This workflow uses the already-committed cache file

      - name: Check GLS cache status
        run: |
          echo "=== Cache file status ==="
          ls -la data/gls_all_locations.json 2>/dev/null || echo "GLS cache not found"
          if [ -f data/gls_all_locations.json ]; then
            echo "GLS: $(python -c "import json; d=json.load(open('data/gls_all_locations.json')); print(len(d.get('locations', [])))" 2>/dev/null || echo '0') locations"
          fi

      - name: Generate pakketpunten data
        run: |
          python scripts/batch_generate.py
          python scripts/create_national_overview.py
        working-directory: ${{ github.workspace }}
        timeout-minutes: 60

      - name: Update totals history
        run: python scripts/update_totals_history.py
        working-directory: ${{ github.workspace }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit and push if changed
        run: |
          # Pull latest changes first (in case repo was updated during workflow)
          git pull --rebase origin main || true
          # Add cache files (DHL, DPD data - GLS committed by separate workflow)
          git add data/dhl_all_locations.json data/dpd_all_locations.json 2>/dev/null || true
          # Add municipality GeoJSON files (excluding gitignored nederland-boundaries.geojson)
          find webapp/public/data -name "*.geojson" -not -name "nederland-boundaries.geojson" -exec git add {} +
          git add webapp/public/data/summary.json webapp/public/data/totals_history.json webapp/public/municipalities.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Update pakketpunten data - $(date +'%Y-%m-%d %H:%M UTC')" && git push)
