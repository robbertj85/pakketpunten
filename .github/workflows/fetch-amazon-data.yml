name: Fetch Amazon Data

on:
  # Run on schedule (before main update job)
  schedule:
    - cron: '30 0 * * 1'  # Monday 00:30 UTC (after GLS at 00:00)
  workflow_dispatch:

jobs:
  fetch-amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch Amazon data
        id: fetch
        run: |
          python scripts/amazon_fetch_all.py
          echo "status=ok" >> "$GITHUB_OUTPUT"
        timeout-minutes: 90
        continue-on-error: true

      - name: Check for data anomaly
        id: check
        run: |
          if [ "${{ steps.fetch.outcome }}" = "failure" ]; then
            echo "anomaly=true" >> "$GITHUB_OUTPUT"
            echo "carrier=Amazon" >> "$GITHUB_OUTPUT"
            echo "::warning::Amazon data anomaly detected - existing cache preserved"
          else
            echo "anomaly=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send alert email on anomaly
        if: steps.check.outputs.anomaly == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_EMAIL_USERNAME }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "⚠️ Pakketpunten: Amazon data anomaly detected"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: Pakketpunten Bot <${{ secrets.ALERT_EMAIL_USERNAME }}>
          body: |
            The Amazon data fetch detected an anomaly (>20% drop in location count or 0 results).
            The existing cache has been preserved to prevent data loss.

            Please investigate the Amazon API and re-run the workflow manually when resolved.

            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Configure Git
        if: steps.check.outputs.anomaly == 'false'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit and push Amazon data
        if: steps.check.outputs.anomaly == 'false'
        run: |
          git pull --rebase origin main || true
          git add data/amazon_all_locations.json 2>/dev/null || true
          git add scripts/amazon_update_log.txt 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Update Amazon data - $(date +'%Y-%m-%d %H:%M UTC')" && git push)
